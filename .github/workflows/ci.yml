name: CI

on:
  push:
  pull_request:

jobs:
  build-test-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain
        run: moon version --all

      - name: Check
        run: moon check

      - name: Test
        run: moon test

      - name: Build
        run: moon build

      - name: Run demo
        run: moon run cmd/moontide -- predict --station demo --date 2026-10-12 --tz 8 --hours 24
